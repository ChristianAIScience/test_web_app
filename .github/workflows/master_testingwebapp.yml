
name: Build and deploy Python app to Azure Web App - testingwebapp

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: uv installieren
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Abhängigkeiten installieren
        run: uv sync --locked

      # Optional: Tests ausführen
      # - name: Tests
      #   run: uv run pytest

      - name: Deployment-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !.git/
            !.github/
            !.venv/
            !__pycache__/
            !.pytest_cache/
            !antenv/
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Deployment-Artefakt herunterladen
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: app

      - name: Bei Azure anmelden
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Web App deployen
        uses: azure/webapps-deploy@v3
        with:
          app-name: testingwebapp
          slot-name: Production
          package: app